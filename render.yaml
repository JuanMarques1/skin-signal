services:
  - type: web
    name: skin-signal-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: backend/SkinSignal.Api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: "10000"
      - key: INITIALIZE_DATABASE
        value: "true"
      - key: ALLOWED_ORIGINS
        value: https://skin-signal.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: skin-signal-db
          property: connectionString
databases:
  - name: skin-signal-db
    plan: free
    region: oregon
    databaseName: skinsignal
    user: skinsignal
    ipAllowList: []
